# Arabic letters as a skeleton and marks, for the `ccmp` decomposition
# that `src/text/arabic_features.rs` writes.
#
# Each `[[letter]]` table gives one letter by its code point, the glyph
# name of the letter, the glyph name of its skeleton, and the glyph names
# of its dot or hamza marks, in the order of the output of the rule.
# A font whose letter glyph is empty, and that has the skeleton and the
# marks, gets `sub letter by skeleton mark ...;` in `ccmp`, and the marks
# then attach to the skeleton through the anchors of the font.
#
# Names follow the glyph data of Glyphs, which glyphsLib and fontc also
# use: the letter name with the script suffix `-ar`, such as `teh-ar` for
# U+062A, and for unencoded marks the name of the mark in that data, such
# as `twodotshorizontalabove-ar`.
# The table itself is written for Runebender from the structure of each
# letter: the Unicode canonical decomposition where the letter has one
# (U+0622 to U+0626, U+06C0, U+06C2, U+06D3), and otherwise the dotless
# letter that carries the same body and the dots that the Unicode name
# of the letter describes.
#
# Choices:
# - The skeleton of a letter is the letter of the same body without
#   dots: `behDotless-ar` (U+066E) for beh, teh, theh, tteh and peh,
#   `fehDotless-ar` (U+06A1) for feh and veh, `qafDotless-ar` (U+066F)
#   for qaf, `noonghunna-ar` (U+06BA) for noon, and the plain letter for
#   letters that have a dotless counterpart in the basic alphabet, such
#   as `hah-ar` for jeem and khah.
# - Yeh and the letters with a yeh body use `alefMaksura-ar` (U+0649),
#   the dotless form of yeh.
#   U+0626 decomposes canonically to U+064A U+0654, but its letterform
#   has no dots, so its skeleton is `alefMaksura-ar`.
# - The dots of jeem and tcheh are inside the bowl of hah, not below the
#   letter, so they use the `center` marks of the glyph data, which
#   attach by a `center` anchor.
# - Farsi yeh (U+06CC) is not in the table: its initial and medial forms
#   have two dots below and its isolated and final forms have none, and
#   `ccmp` runs before the positional features.
# - Letters without dots or hamza, such as alef, dal, reh, seen, lam and
#   meem, are skeletons themselves and are not in the table.

# Hamza and madda letters, from their canonical decompositions.

[[letter]]
codepoint = 0x0622
name = "alefMadda-ar"
skeleton = "alef-ar"
marks = ["madda-ar"]

[[letter]]
codepoint = 0x0623
name = "alefHamzaabove-ar"
skeleton = "alef-ar"
marks = ["hamzaabove-ar"]

[[letter]]
codepoint = 0x0624
name = "wawHamzaabove-ar"
skeleton = "waw-ar"
marks = ["hamzaabove-ar"]

[[letter]]
codepoint = 0x0625
name = "alefHamzabelow-ar"
skeleton = "alef-ar"
marks = ["hamzabelow-ar"]

[[letter]]
codepoint = 0x0626
name = "yehHamzaabove-ar"
skeleton = "alefMaksura-ar"
marks = ["hamzaabove-ar"]

