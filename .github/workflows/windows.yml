# Diagnostic current-stable coverage; Linux/macOS on pinned Rust are primary.
# Do not hide failures with continue-on-error or imply native parity.
name: Windows basics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      collect_crash_dump:
        description: 'Retry failed native startup under installed CDB (public fixture memory; dump retained 1 day)'
        type: boolean
        default: true
      native_observation_seconds:
        description: 'Observe the real native window before requesting close (crashes still fail)'
        type: choice
        options: ['0', '5', '15']
        default: '0'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: eliheuer/virtua-grotesk
          ref: 018488ed9499b7f2c18a249f5406797fc6a20e1d
          path: test-fonts
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The explicit toolchain prevents rust-toolchain.toml selecting minimum Rust.
      - name: Check reusable engine without application features
        run: cargo +stable check --lib --no-default-features --locked
      - name: Check production targets
        run: cargo +stable check --workspace --lib --bins --locked
      - name: Check auxiliary targets
        run: cargo +stable check --workspace --tests --examples --benches --features integration-fonts --locked
      - name: Build the Windows application
        run: cargo +stable build --locked --bin runebender
      - name: Exercise CLI, rendering, and native startup
        shell: pwsh
        env:
          COLLECT_CRASH_DUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.collect_crash_dump }}
          NATIVE_OBSERVATION_SECONDS: ${{ inputs.native_observation_seconds || '0' }}
        run: |
          $collect = $env:COLLECT_CRASH_DUMP -eq 'true'
          ./.github/scripts/windows-smoke.ps1 -CollectCrashDump:$collect -NativeObservationSeconds ([int]$env:NATIVE_OBSERVATION_SECONDS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          # Explicit filenames exclude private scratch files and arbitrary future outputs.
          path: |
            windows-smoke/info.json
            windows-smoke/proof.svg
            windows-smoke/editor.png
            windows-smoke/native-window.txt
            windows-smoke/window.stdout.txt
            windows-smoke/window.stderr.txt
            windows-smoke/masonry-dense.log
            windows-smoke/diagnostic-status.json
            windows-smoke/native-debugger.log
            windows-smoke/native-debugger.stderr.txt
          retention-days: 1
      # Never collect dumps automatically on PRs/pushes. Binary process memory cannot be redacted.
      # One installed-CDB reproduction may produce a <=64 MiB minidump; the native gate still fails.
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.collect_crash_dump
        with:
          name: windows-native-minidump
          path: windows-smoke-dumps/runebender.dmp
          if-no-files-found: warn
          retention-days: 1
